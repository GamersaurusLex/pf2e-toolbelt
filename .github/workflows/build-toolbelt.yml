name: Build Toolbelt

on:
  workflow_dispatch:
  push:
    branches:
      - codex/pre-use-physical-item-hook

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git clone --depth 1 https://github.com/reonZ/foundry-helpers.git /tmp/foundry-helpers
      - run: npm ci && npm run build
        working-directory: /tmp/foundry-helpers
      - run: npm ci
      - run: rm -rf node_modules/foundry-helpers && cp -R /tmp/foundry-helpers node_modules/foundry-helpers
      - run: npm run build
      # The upstream source currently has unrelated type errors in its region tools.
      # Keep them visible without blocking a runtime build of this focused fork.
      - run: npm run check
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: pf2e-toolbelt-build
          path: |
            scripts/main.js
            scripts/main.js.map
